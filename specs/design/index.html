<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cortex — Protótipo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tabler Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.4.0/dist/tabler-icons.min.css">

<link rel="stylesheet" href="styles.css">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #07070A; font-family: 'Inter', sans-serif; overflow: hidden; }
  body { color: #F0F0F5; }
</style>

<!-- React -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Starters & components -->
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>

<!-- Screens -->
<script type="text/babel" src="screens/Onboarding.jsx"></script>
<script type="text/babel" src="screens/Dashboard.jsx"></script>
<script type="text/babel" src="screens/AIAssistant.jsx"></script>
<script type="text/babel" src="screens/Tasks.jsx"></script>
<script type="text/babel" src="screens/StatusReport.jsx"></script>
<script type="text/babel" src="screens/MobileDashboard.jsx"></script>

<script type="text/babel" src="PlayerShell.jsx"></script>

<script type="text/babel">
const SCREENS = [
  { component: ScreenOnboarding, title: 'Onboarding · Seleção de perfil', subtitle: 'Primeira experiência, define cor & conteúdo do app', w: 1440, h: 900 },
  { component: ScreenDashboard, title: 'Dashboard principal', subtitle: 'A tela que o usuário mais vê — resumo do dia, tarefas, agenda', w: 1440, h: 900 },
  { component: ScreenAIAssistant, title: 'Assistente de IA', subtitle: 'Conversa contextualizada, histórico e resultados estruturados', w: 1440, h: 900 },
  { component: ScreenTasks, title: 'Tarefas · perfil Estudante', subtitle: 'Disciplinas como cor, foco do dia pela IA, urgência visível', w: 1440, h: 900 },
  { component: ScreenStatusReport, title: 'Status Report · perfil Coordenador', subtitle: 'Métricas, riscos e 3 versões do texto por audiência', w: 1440, h: 900 },
  { component: () => (
    <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', width: '100%', height: '100%', background: '#0F0F13' }}>
      <ScreenMobile />
    </div>
  ), title: 'Mobile · Dashboard (iOS)', subtitle: 'Versão mobile thumb-friendly, IA em destaque na bottom nav', w: 420, h: 870 },
];

ReactDOM.createRoot(document.getElementById('root')).render(<PlayerShell screens={SCREENS} />);
</script>

</body>
</html>
